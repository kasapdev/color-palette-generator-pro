<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="Generate, lock and export gorgeous color palettes in HEX, RGB and HSL. Harmony modes, saved palettes, CSS/JSON/PNG export.">
  <title>Color Palette Generator â€” Web Utility Suite</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar container">
    <a class="brand" href="https://github.com/kasapdev/web-utility-suite" aria-label="Back to Web Utility Suite">
      <span class="logo" aria-hidden="true">
        <!-- swatch / palette icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.3A4.4 4.4 0 0 0 22 11c0-5-4.5-9-10-9Z"/>
          <circle cx="7.5" cy="10.5" r="1.2" fill="#fff" stroke="none"/>
          <circle cx="12" cy="7.5" r="1.2" fill="#fff" stroke="none"/>
          <circle cx="16.5" cy="10.5" r="1.2" fill="#fff" stroke="none"/>
        </svg>
      </span>
      <span class="col" style="gap:0"><span>Color Palette Generator</span><span class="sub">Web Utility Suite</span></span>
    </a>
    <span class="spacer"></span>
    <button class="btn btn--icon" data-shortcut-help title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M10 13h4"/>
      </svg>
    </button>
    <button class="btn btn--icon" data-theme-toggle title="Toggle theme" aria-label="Toggle theme">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
      </svg>
    </button>
  </header>

  <main class="container">
    <!-- Controls -->
    <section class="panel controls fade-in" aria-label="Palette controls">
      <div class="controls-grid">
        <div class="field">
          <label id="harmony-label">Harmony</label>
          <div class="segmented harmony" role="tablist" aria-labelledby="harmony-label" id="harmony">
            <button role="tab" data-harmony="auto" aria-selected="true" class="is-active">Auto</button>
            <button role="tab" data-harmony="analogous" aria-selected="false">Analogous</button>
            <button role="tab" data-harmony="complementary" aria-selected="false">Complementary</button>
            <button role="tab" data-harmony="triadic" aria-selected="false">Triadic</button>
            <button role="tab" data-harmony="monochrome" aria-selected="false">Monochrome</button>
          </div>
        </div>

        <div class="field base-field">
          <label for="base-color">Base color</label>
          <div class="base-wrap">
            <input type="color" id="base-color" value="#6366f1" aria-label="Base seed color">
            <input type="text" id="base-hex" class="mono" value="#6366F1" spellcheck="false" aria-label="Base color hex" maxlength="7">
          </div>
        </div>

        <div class="field actions-field">
          <label class="sr-only">Actions</label>
          <div class="actions-row">
            <button class="btn btn--primary" id="generate" title="Generate (Space)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
              Generate
            </button>
            <button class="btn" id="save-btn" title="Save palette (S)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
              Save
            </button>
            <button class="btn" id="copy-all" title="Copy all HEX (C)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Copy HEX
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Palette -->
    <section class="palette rise" id="palette" aria-label="Generated palette"></section>

    <!-- Export bar -->
    <section class="panel export-bar fade-in" aria-label="Export options">
      <span class="export-title">Export</span>
      <div class="export-actions">
        <button class="btn btn--sm" data-export="css">Copy CSS vars</button>
        <button class="btn btn--sm" data-export="json">Copy JSON</button>
        <button class="btn btn--sm" data-export="list">Copy list</button>
        <span class="export-sep" aria-hidden="true"></span>
        <button class="btn btn--sm" data-download="css">Download .css</button>
        <button class="btn btn--sm" data-download="json">Download .json</button>
        <button class="btn btn--sm" data-download="png">Download .png</button>
      </div>
    </section>

    <!-- Saved -->
    <section class="saved-section" aria-label="Saved palettes">
      <div class="saved-head">
        <h2>Saved palettes</h2>
        <div class="saved-tools">
          <div class="segmented" role="tablist" aria-label="Filter saved palettes" id="saved-filter">
            <button role="tab" data-filter="all" aria-selected="true" class="is-active">All</button>
            <button role="tab" data-filter="favorites" aria-selected="false">Favorites</button>
          </div>
          <button class="btn btn--sm btn--ghost" id="clear-saved" title="Remove all saved palettes">Clear all</button>
        </div>
      </div>
      <div id="saved-list" class="saved-list"></div>
    </section>
  </main>

  <footer class="app-footer container">Part of the <a href="https://github.com/kasapdev/web-utility-suite">Web Utility Suite</a> Â· MIT Licensed</footer>

  <!-- Shortcuts modal -->
  <div class="modal-backdrop" id="help-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div class="row between center" style="margin-bottom:var(--space-4)">
        <h3 id="help-title" style="margin:0">Keyboard shortcuts</h3>
        <button class="btn btn--icon btn--ghost" id="help-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <table class="shortcuts-table">
        <tbody>
          <tr><td><kbd>Space</kbd></td><td>Generate new palette</td></tr>
          <tr><td><kbd>S</kbd></td><td>Save current palette</td></tr>
          <tr><td><kbd>C</kbd></td><td>Copy all HEX values</td></tr>
          <tr><td><kbd>1</kbd>â€“<kbd>5</kbd></td><td>Toggle lock on swatch</td></tr>
          <tr><td><kbd>?</kbd></td><td>Open this help</td></tr>
          <tr><td><kbd>Esc</kbd></td><td>Close dialog</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="assets/js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
